<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Scaledex app icon: an original dex-style handheld (lens, lights, hinge, screen).
       Full-bleed background so it also works as a maskable icon; artwork stays in the
       central safe zone. Source for icon-180/192/512.png. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4a3c"/>
      <stop offset="1" stop-color="#c22a24"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9fe3ff"/>
      <stop offset="0.55" stop-color="#2f9be0"/>
      <stop offset="1" stop-color="#1767a8"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#body)"/>
  <!-- hinge / panel line -->
  <path d="M40 252 H226 L262 214 H472" fill="none" stroke="#8e1b17" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- lens -->
  <circle cx="150" cy="140" r="74" fill="#fff"/>
  <circle cx="150" cy="140" r="60" fill="url(#lens)"/>
  <circle cx="128" cy="116" r="15" fill="#fff" opacity="0.85"/>
  <!-- lights -->
  <circle cx="266" cy="104" r="17" fill="#ff8a80" stroke="#8e1b17" stroke-width="6"/>
  <circle cx="318" cy="104" r="17" fill="#ffd54a" stroke="#8e1b17" stroke-width="6"/>
  <circle cx="370" cy="104" r="17" fill="#6fdc8c" stroke="#8e1b17" stroke-width="6"/>
  <!-- screen with three figures of different scale -->
  <rect x="106" y="292" width="300" height="156" rx="22" fill="#f4f7f8"/>
  <rect x="126" y="310" width="260" height="120" rx="12" fill="#183b48"/>
  <rect x="168" y="382" width="34" height="30" rx="8" fill="#58d0ff"/>
  <rect x="239" y="352" width="34" height="60" rx="8" fill="#58d0ff"/>
  <rect x="310" y="326" width="34" height="86" rx="8" fill="#58d0ff"/>
  <rect x="150" y="414" width="212" height="5" rx="2.5" fill="#58d0ff" opacity="0.6"/>
</svg>
